<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title=${editMode} ? 'Edit Task' : 'New Task')}"></head>
<body class="app-body">

<div th:replace="~{fragments/navbar :: sidebar(activeMenu='tasks')}"></div>

<main class="main-content">

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${editMode} ? 'Edit Task' : 'Create New Task'">New Task</h1>
            <p class="page-subtitle">Follow-ups stay visible in the record's activity feed.</p>
        </div>
        <div>
            <a th:href="${editMode ? '/tasks/' + taskId : '/tasks'}" class="btn btn-secondary">← Back</a>
        </div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span>⚠</span><span th:text="${errorMessage}">Error message</span>
    </div>

    <div class="card form-card">
        <form th:action="${editMode ? '/tasks/' + taskId : '/tasks'}"
              th:object="${taskDto}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-row">
                <div class="form-group">
                    <label for="title">Task Title *</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''"
                           placeholder="e.g. Follow up on proposal"/>
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="field-error">Title required</span>
                </div>
                <div class="form-group">
                    <label for="dueAt">Due Date & Time *</label>
                    <input type="datetime-local" id="dueAt" th:field="*{dueAt}" class="form-control"
                           th:classappend="${#fields.hasErrors('dueAt')} ? ' is-invalid' : ''"/>
                    <span th:if="${#fields.hasErrors('dueAt')}" th:errors="*{dueAt}" class="field-error">Due date required</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" th:field="*{status}" class="form-control">
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}">Pending</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="priority">Priority *</label>
                    <select id="priority" th:field="*{priority}" class="form-control">
                        <option th:each="pr : ${priorities}" th:value="${pr}" th:text="${pr.displayName}">Medium</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="linkedEntityType">Linked Record Type *</label>
                    <select id="linkedEntityType" th:field="*{linkedEntityType}" class="form-control"
                            th:classappend="${#fields.hasErrors('linkedEntityType')} ? ' is-invalid' : ''">
                        <option value="">— Select type —</option>
                        <option th:each="et : ${entityTypes}" th:value="${et}" th:text="${et.displayName}">Customer</option>
                    </select>
                    <span th:if="${#fields.hasErrors('linkedEntityType')}" th:errors="*{linkedEntityType}" class="field-error">Type required</span>
                </div>
                <div class="form-group">
                    <label for="linkedEntityId">Linked Record ID *</label>
                    <input type="number" id="linkedEntityId" th:field="*{linkedEntityId}" class="form-control"
                           th:classappend="${#fields.hasErrors('linkedEntityId')} ? ' is-invalid' : ''"
                           placeholder="e.g. 1"/>
                    <span th:if="${#fields.hasErrors('linkedEntityId')}" th:errors="*{linkedEntityId}" class="field-error">Record required</span>
                    <small th:if="${linkedRecord != null}" style="font-size: 11.5px; color: var(--accent-light);"
                           th:text="${linkedRecord.displayName()}">Selected record</small>
                    <small th:unless="${linkedRecord != null}" style="font-size: 11.5px; color: var(--text-faint);">
                        Use the "Add Task" button on a record page to pre-fill this automatically.
                    </small>
                </div>
            </div>

            <div class="form-row-single" sec:authorize="hasRole('ADMIN')">
                <div class="form-group">
                    <label for="assignedToId">Assigned Sales Rep</label>
                    <select id="assignedToId" th:field="*{assignedToId}" class="form-control">
                        <option value="">— Assign to me —</option>
                        <option th:each="rep : ${salesReps}" th:value="${rep.id}"
                                th:text="${rep.name + ' (' + rep.email + ')'}">Rep Name</option>
                    </select>
                </div>
            </div>

            <div class="form-row-single">
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                              placeholder="What needs to happen next?"></textarea>
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error">Description too long</span>
                </div>
            </div>

            <div class="form-actions">
                <a th:href="${editMode ? '/tasks/' + taskId : '/tasks'}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" id="btn-save-task">
                    <span th:text="${editMode} ? 'Save Changes' : 'Create Task'">Save</span>
                </button>
            </div>
        </form>
    </div>

</main>

</body>
</html>
