<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='User Management')}"></head>
<body class="app-body">

<!-- Sidebar -->
<div th:replace="~{fragments/navbar :: sidebar(activeMenu='users')}"></div>

<!-- Main content -->
<main class="main-content">

    <!-- Page header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">User Management</h1>
            <p class="page-subtitle">Create, edit, and manage Sales Rep accounts.</p>
        </div>
        <a th:href="@{/admin/users/new}" class="btn btn-primary" id="newUserBtn">
            + New User
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success" id="flashSuccess">
        ✓ <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" id="flashError">
        ✗ <span th:text="${errorMessage}"></span>
    </div>

    <!-- Users table -->
    <div class="card">
        <div class="table-responsive">
            <table class="table" id="usersTable">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div class="user-cell">
                                <div class="user-avatar-sm"
                                     th:text="${user.name.substring(0,1).toUpperCase()}">A</div>
                                <span th:text="${user.name}">John Smith</span>
                            </div>
                        </td>
                        <td th:text="${user.email}">john@example.com</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-purple' : 'badge-blue'"
                                  th:text="${user.role.displayName}">Admin</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.enabled} ? 'badge-green' : 'badge-red'"
                                  th:text="${user.enabled ? 'Active' : 'Inactive'}">Active</span>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'MMM d, yyyy')}">Jan 1, 2024</td>
                        <td>
                            <div class="action-buttons">
                                <!-- Edit -->
                                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                   class="btn btn-sm btn-secondary"
                                   th:id="'editBtn-' + ${user.id}">Edit</a>

                                <!-- Deactivate (only if enabled) -->
                                <form th:if="${user.enabled}"
                                      th:action="@{/admin/users/{id}/deactivate(id=${user.id})}"
                                      method="post"
                                      style="display:inline;"
                                      th:id="'deactivateForm-' + ${user.id}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn btn-sm btn-danger"
                                            th:id="'deactivateBtn-' + ${user.id}"
                                            onclick="return confirm('Deactivate this user? They will no longer be able to log in.')">
                                        Deactivate
                                    </button>
                                </form>

                                <!-- Activate (only if disabled) -->
                                <form th:if="${!user.enabled}"
                                      th:action="@{/admin/users/{id}/activate(id=${user.id})}"
                                      method="post"
                                      style="display:inline;"
                                      th:id="'activateForm-' + ${user.id}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn btn-sm btn-success"
                                            th:id="'activateBtn-' + ${user.id}">
                                        Activate
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <!-- Empty state -->
                    <tr th:if="${users.empty}">
                        <td colspan="6" class="empty-state">
                            No users found. <a th:href="@{/admin/users/new}">Create the first one →</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
