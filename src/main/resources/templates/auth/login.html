<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — CRM Pro</title>
    <meta name="description" content="Sign in to CRM Pro — Sales Intelligence Platform"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">

        <!-- Brand -->
        <div class="auth-brand">
            <span class="brand-logo">⚡</span>
            <h1 class="brand-name">CRM Pro</h1>
            <p class="brand-tagline">Sales Intelligence Platform</p>
        </div>

        <!-- Flash / param alerts -->
        <div th:if="${param.error}" class="alert alert-danger">
            Invalid email or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You have been signed out successfully.
        </div>
        <div th:if="${param.disabled}" class="alert alert-danger">
            Your account is no longer active (or your role changed). Contact your admin.
        </div>

        <!-- Login form -->
        <form th:action="@{/login}" method="post" class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="admin@crm.com"
                       autocomplete="email"
                       required
                       autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="••••••••"
                       autocomplete="current-password"
                       required/>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="signInBtn">
                Sign In →
            </button>
        </form>

    </div>

    <p style="text-align:center;font-size:12px;color:var(--text-faint);margin-top:20px;">
        CRM Pro · Phase 1 · Portfolio Project
    </p>
</div>

</body>
</html>
