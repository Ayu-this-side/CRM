<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Access Denied')}"></head>
<body class="auth-body">

<a class="skip-link" href="#error-content">Skip to message</a>
<div th:replace="~{fragments/icons :: sprite}"></div>

<main class="auth-main" id="error-content">
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <svg class="icon icon-lg" aria-hidden="true"><use href="#i-shield"/></svg>
            </div>
            <div class="error-status" aria-hidden="true">403</div>
            <h1>Access denied</h1>
            <p>You don't have permission to view this page.<br/>
               Contact your admin if you believe this is an error.</p>
            <a th:href="@{/}" class="btn btn-primary" id="goHomeBtn">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
                Back to dashboard
            </a>
        </div>
    </div>
</main>

</body>
</html>
