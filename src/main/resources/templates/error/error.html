<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title=${errorTitle ?: 'Error'})}"></head>
<body class="auth-body">

<a class="skip-link" href="#error-content">Skip to message</a>
<div th:replace="~{fragments/icons :: sprite}"></div>

<main class="auth-main" id="error-content">
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <svg class="icon icon-lg" aria-hidden="true"><use href="#i-exclamation"/></svg>
            </div>
            <div class="error-status" aria-hidden="true" th:text="${statusCode ?: ''}"></div>
            <h1 th:text="${errorTitle ?: 'Something Went Wrong'}">Error</h1>
            <p th:text="${errorMessage ?: 'An unexpected error occurred. Please try again.'}">
                An unexpected error occurred.
            </p>
            <a th:href="@{/}" class="btn btn-primary" id="goHomeBtn">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
                Back to dashboard
            </a>
        </div>
    </div>
</main>

</body>
</html>
