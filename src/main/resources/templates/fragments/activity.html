<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Chronological activity feed shared by Lead, Customer and Deal detail pages.
  Usage: <div th:replace="~{fragments/activity :: feed(${activity}, ${entityType}, ${entityId})}"></div>
-->
<div th:fragment="feed(activities, entityType, entityId)" class="detail-card">
    <div class="detail-card-title">
        <span>Activity & Follow-ups</span>
        <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;"
              th:text="${activities.size()} + ' entries'">0 entries</span>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">
        <a th:href="@{/communications/new(entityType=${entityType}, entityId=${entityId})}"
           class="btn btn-sm btn-secondary">📝 Log Activity</a>
        <a th:href="@{/tasks/new(entityType=${entityType}, entityId=${entityId})}"
           class="btn btn-sm btn-secondary">✅ Add Task</a>
        <a th:href="@{/email/new(entityType=${entityType}, entityId=${entityId})}"
           class="btn btn-sm btn-secondary">✉️ Send Email</a>
    </div>

    <div th:if="${activities.isEmpty()}" style="font-size: 13px; color: var(--text-faint); line-height: 1.6;">
        No activity yet. Log a call, add a follow-up task, or send an email to start the timeline.
    </div>

    <div class="activity-timeline" th:unless="${activities.isEmpty()}">
        <div th:each="item : ${activities}" class="activity-entry">
            <div class="activity-icon" th:text="${item.icon}">•</div>
            <div class="activity-body">
                <div class="activity-heading">
                    <span th:if="${item.path != null}">
                        <a th:href="${item.path}" style="color: var(--text); font-weight: 600;"
                           th:text="${item.title}">Activity</a>
                    </span>
                    <span th:unless="${item.path != null}" style="color: var(--text); font-weight: 600;"
                          th:text="${item.title}">Activity</span>
                    <span class="badge" th:classappend="${item.badgeClass}"
                          th:text="${item.statusLabel}">Status</span>
                </div>
                <div th:if="${item.detail != null and !item.detail.isEmpty()}"
                     class="activity-detail" th:text="${item.detail}">Details</div>
                <div class="activity-time" th:text="${#temporals.format(item.timestamp, 'MMM d, yyyy h:mm a')}">Jan 1, 2027</div>
            </div>
        </div>
    </div>

    <div style="margin-top: 12px; font-size: 12px; color: var(--text-faint);">
        <a th:href="@{/tasks(entityType=${entityType}, entityId=${entityId})}"
           style="color: var(--accent-light);">View all tasks for this record →</a>
    </div>
</div>

</body>
</html>
