<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Chronological activity feed shared by Lead, Customer and Deal detail pages.
  Usage: <div th:replace="~{fragments/activity :: feed(${activity}, ${entityType}, ${entityId})}"></div>
-->
<div th:fragment="feed(activities, entityType, entityId)" class="detail-card">
    <div class="detail-card-title">
        <span>Activity &amp; follow-ups</span>
        <span class="section-note" th:text="${activities.size()} + ' entries'">0 entries</span>
    </div>

    <div class="flex mb-4">
        <a th:href="@{/communications/new(entityType=${entityType}, entityId=${entityId})}"
           class="btn btn-sm btn-secondary">
            <svg class="icon" aria-hidden="true"><use href="#i-note"/></svg>
            Log activity
        </a>
        <a th:href="@{/tasks/new(entityType=${entityType}, entityId=${entityId})}"
           class="btn btn-sm btn-secondary">
            <svg class="icon" aria-hidden="true"><use href="#i-check-square"/></svg>
            Add task
        </a>
        <a th:href="@{/email/new(entityType=${entityType}, entityId=${entityId})}"
           class="btn btn-sm btn-secondary">
            <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
            Send email
        </a>
    </div>

    <div th:if="${activities.isEmpty()}" class="empty-state">
        <svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>
        <p>No activity yet. Log a call, add a follow-up task, or send an email to start the timeline.</p>
    </div>

    <div class="activity-timeline" th:unless="${activities.isEmpty()}">
        <div th:each="item : ${activities}" class="activity-entry">
            <div class="activity-icon">
                <th:block th:switch="${item.kind}">
                    <svg th:case="'TASK'" class="icon" aria-hidden="true"><use href="#i-check-square"/></svg>
                    <svg th:case="'COMMUNICATION'" class="icon" aria-hidden="true"><use href="#i-note"/></svg>
                    <svg th:case="*" class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>
                </th:block>
            </div>
            <div class="activity-body">
                <div class="activity-heading">
                    <a th:if="${item.path != null}" th:href="${item.path}" th:text="${item.title}">Activity</a>
                    <strong th:unless="${item.path != null}" th:text="${item.title}">Activity</strong>
                    <span class="badge badge-neutral" th:classappend="${item.badgeClass}"
                          th:text="${item.statusLabel}">Status</span>
                </div>
                <div th:if="${item.detail != null and !item.detail.isEmpty()}"
                     class="activity-detail" th:text="${item.detail}">Details</div>
                <div class="activity-time" th:text="${#temporals.format(item.timestamp, 'MMM d, yyyy h:mm a')}">Jan 1, 2027</div>
            </div>
        </div>
    </div>

    <div class="section-note mt-3">
        <a class="list-link" th:href="@{/tasks(entityType=${entityType}, entityId=${entityId})}">
            View all tasks for this record
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-arrow-right"/></svg>
        </a>
    </div>
</div>

</body>
</html>
