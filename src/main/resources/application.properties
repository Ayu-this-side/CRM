# =========================================
# CRM System — Application Configuration
# =========================================

spring.application.name=CRM System

# =========================================
# DataSource — PostgreSQL
# =========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/crm_db
spring.datasource.username=${CRM_DB_USER:postgres}
spring.datasource.password=${CRM_DB_PASSWORD:Password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# =========================================
# JPA / Hibernate
# =========================================
# 'validate' — Hibernate checks that DB schema matches entities.
# Flyway handles all DDL; Hibernate NEVER creates/drops tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 6 — no explicit dialect needed.

# =========================================
# Flyway
# =========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# =========================================
# Thymeleaf
# =========================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =========================================
# Server
# =========================================
server.port=8081

# Error handling — internal messages stay server-side
server.error.include-stacktrace=never
server.error.include-message=never

# Demo accounts/sample records are seeded only on a fresh database.
# Set to false outside local development.
crm.seed.enabled=true

# =========================================
# Logging
# =========================================
logging.level.com.crm=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
