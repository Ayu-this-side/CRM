# =========================================
# CRM System — Application Configuration
# =========================================

spring.application.name=CRM System

# =========================================
# DataSource — PostgreSQL
# =========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/crm_db
spring.datasource.username=${CRM_DB_USER:postgres}
spring.datasource.password=${CRM_DB_PASSWORD:Password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# =========================================
# JPA / Hibernate
# =========================================
# 'validate' — Hibernate checks that DB schema matches entities.
# Flyway handles all DDL; Hibernate NEVER creates/drops tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 6 — no explicit dialect needed.

# =========================================
# Flyway
# =========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# =========================================
# Thymeleaf
# =========================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =========================================
# Server
# =========================================
server.port=8081

# Error handling — internal messages stay server-side
server.error.include-stacktrace=never
server.error.include-message=never

# Demo accounts/sample records are seeded only on a fresh database.
# Set to false outside local development.
crm.seed.enabled=true

# =========================================
# Mail (Phase 4) — simulate by default
# =========================================
# A host is set so Spring creates JavaMailSender, but nothing is sent until
# crm.mail.enabled=true. Override SMTP settings with CRM_SMTP_* env vars.
spring.mail.host=${CRM_SMTP_HOST:localhost}
spring.mail.port=${CRM_SMTP_PORT:587}
spring.mail.username=${CRM_SMTP_USER:}
spring.mail.password=${CRM_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${CRM_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${CRM_SMTP_STARTTLS:true}
crm.mail.enabled=${CRM_MAIL_ENABLED:false}
crm.mail.from=${CRM_MAIL_FROM:crm@localhost}

# Daily task digest (08:00 local time by default)
crm.tasks.digest.enabled=${CRM_DIGEST_ENABLED:true}
crm.tasks.digest.cron=${CRM_DIGEST_CRON:0 0 8 * * *}

# =========================================
# Logging
# =========================================
logging.level.com.crm=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
